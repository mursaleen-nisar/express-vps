name: Deploy NodeJS app on VPS

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: QEMU
              uses: docker/setup-qemu-action@v4

            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build and Push
              run: |
                docker build -t mursaleennisar/express-vps .
                docker push mursaleennisar/express-vps

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: 129.121.133.139
                username: mursaleennisar
                key: ${{ secrets.PRIVATE_KEY }}
                script: |
                  # Kill existing container if running
                  docker rm -f express-vps || true

                  # Pull latest image from Docker Hub
                  docker pull mursaleennisar/express-vps

                  # Run new container
                  docker run -d --name express-vps --restart unless-stopped -p 80:3000 mursaleennisar/express-vps